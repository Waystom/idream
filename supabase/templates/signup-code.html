<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:32px 20px;background:#f1f4f0;font-family:Arial,'Microsoft YaHei',sans-serif;color:#253b33;">
    <div style="max-width:480px;margin:0 auto;">
      <p style="margin:0 0 28px;font-family:Georgia,serif;font-size:30px;">Idream</p>
      <h1 style="margin:0 0 16px;font-size:22px;font-weight:400;">你的注册验证码</h1>
      <p style="font-size:15px;line-height:1.8;">请回到 Idream，在注册页面输入以下验证码，完成邮箱验证：</p>
      <p style="margin:28px 0;padding:24px 16px;background:#ffffff;border:1px solid #d4ded5;border-radius:6px;text-align:center;font-size:32px;font-weight:bold;color:#253b33;">{{ .Token }}</p>
      <p style="font-size:14px;line-height:1.8;">请使用最新一封邮件中的验证码。验证码仅供本人注册使用，请勿转发或告知他人。</p>
      <p style="margin-top:28px;font-size:12px;line-height:1.8;color:#60736a;">如果你没有申请注册，请忽略这封邮件。</p>
    </div>
  </body>
</html>
